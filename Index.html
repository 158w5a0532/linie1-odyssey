<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Grammar Defender: Linie 1 Arcade Odyssey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0c18">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Virtual On-Screen Controls for Mobile & Tablet -->
    <div id="touch-controls" class="hidden">
      <div id="touch-track-zone">
        <span class="touch-hint">SLIDE TO STEER DEFENDER</span>
      </div>
      <div class="touch-btn-cluster">
        <button id="btn-codex" class="touch-btn">CODEX</button>
        <button id="btn-fire" class="touch-btn fire-pulse">FIRE</button>
      </div>
    </div>

    <!-- In-Game Grammatik-Codex Modal Overlay -->
    <div id="codex-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <span id="codex-level-tag">LEVEL 1.22</span>
          <h2 id="codex-title">Akkusativ-Regeln</h2>
          <button id="codex-close" class="close-x">&times;</button>
        </div>
        <div class="modal-body">
          <div id="codex-rule-box"></div>
          <div id="codex-example-box"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-resume-mission" class="arcade-action-btn">RESUME MISSION</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Stage Datasets then Main Game Engine -->
  <script src="data_a1.js"></script>
  <script src="engine.js"></script>
</body>
</html>
